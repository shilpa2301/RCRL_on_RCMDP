  #       - 0.5
  #     upper_bounds:
  #       - 1.5
  #     active_dims:
  #       - 2
  
  constraints:
    - constraint_form: bounded_constraint
      constrained_variable: input
      lower_bounds:
        - 0.0
        - 0.0
      upper_bounds:
        - 0.12
        - 0.12

