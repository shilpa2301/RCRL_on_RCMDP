quadrotor_config:
  seed: 59
  info_in_reset: True
  ctrl_freq: 60
  pyb_freq: 240
  gui:  False #True #False
  physics: pyb
  quad_type: 2
  normalized_rl_action_space: True
  #shilpa
  norm_act_scale: 0.1 #0.5

  init_state:
    init_x: 1
    init_x_dot: 0
    init_z: 1
    init_z_dot: 0
    init_theta: 0
    init_theta_dot: 0
  randomized_init: False
  randomized_inertial_prop: False

  task: stabilization # traj_tracking , stabilization #shilpa
  task_info:
    stabilization_goal: [0, 1]
    stabilization_goal_tolerance: 0.01
    trajectory_type: circle
    num_cycles: 1
    trajectory_plane: "xz"
    trajectory_position_offset: [0, 1]
    trajectory_scale: 1

  episode_len_sec: 6
  cost: rl_reward
  rew_exponential: True #False #shilpa
  done_on_out_of_bound: True

  done_on_violation: False
  # constraints:
